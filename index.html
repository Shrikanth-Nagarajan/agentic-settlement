<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settlement skills for Kai · concept by Shri Nagarajan</title>
<meta name="description" content="Concept prototype by Shri Nagarajan: agentic settlement for a multi-currency payments platform. Explainable payouts, settle-to-spend, and an exceptions agent for settlement operations.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --violet:#612FFF; --violet-ink:#4A1FD6; --violet-soft:#F1ECFF; --violet-line:#D9CCFF;
  --ink:#14171A; --ink-2:#3D454D; --muted:#5C6670; --line:#E3E6EA; --line-2:#EEF0F2;
  --bg:#F6F7F9; --card:#FFFFFF;
  --ok:#0B7A47; --ok-soft:#E6F4EC; --warn:#8F5200; --warn-soft:#FFF4E0; --bad:#B42318; --bad-soft:#FDECEA; --info-soft:#EEF4FF;
  --r:8px; --r-lg:12px;
  --font:"Figtree",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--bg);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--violet-ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:4px}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-60px;background:var(--ink);color:#fff;padding:8px 12px;border-radius:6px;z-index:100}
.skip:focus{top:8px}
.num{font-variant-numeric:tabular-nums}

/* concept + demo bar */
.concept{background:var(--ink);color:#E9EBEE;font-size:12.5px;padding:7px 20px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.concept a{color:#fff}
.demo{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;flex-wrap:wrap;gap:18px;align-items:center}
.demo .grp{display:flex;align-items:center;gap:8px}
.demo label,.demo .lbl{font-size:12px;color:var(--muted);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--bg)}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:6px;cursor:pointer;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line)}
select{font:inherit;border:1px solid var(--line);border-radius:8px;padding:5px 28px 5px 10px;background:#fff;color:var(--ink)}
.clock{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}

/* app shell */
.app{display:grid;grid-template-columns:220px minmax(0,1fr) 360px;min-height:calc(100vh - 92px)}
.app.ops{grid-template-columns:220px minmax(0,1fr)}
.side{background:#fff;border-right:1px solid var(--line);padding:16px 12px}
.org{display:flex;gap:10px;align-items:center;padding:6px 8px 14px;border-bottom:1px solid var(--line-2);margin-bottom:12px}
.mono{width:32px;height:32px;border-radius:8px;background:var(--violet-soft);color:var(--violet-ink);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.org b{display:block;font-size:13.5px}
.org span{font-size:12px;color:var(--muted)}
.side .navh{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 8px 4px}
.side ul{list-style:none;margin:0;padding:0}
.side li span{display:block;padding:7px 10px;border-radius:6px;color:var(--ink-2)}
.side li span.cur{background:var(--violet-soft);color:var(--violet-ink);font-weight:600}
.side li span.dim{color:#8A939C}
main{padding:22px 28px 60px;min-width:0}
h1{font-size:22px;margin:0 0 2px;font-weight:600;letter-spacing:-.01em}
h2{font-size:16px;margin:0 0 10px;font-weight:600}
h3{font-size:14px;margin:0 0 6px;font-weight:600}
.sub{color:var(--muted);margin:0 0 18px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 20px}
.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--violet)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:16px}
.stat .k{font-size:12.5px;color:var(--muted)}
.stat .v{font-size:22px;font-weight:600;margin:4px 0 2px;letter-spacing:-.01em}
.stat .s{font-size:12.5px;color:var(--muted)}
.stack{display:grid;gap:14px}
.row{display:flex;gap:12px;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}

/* tables */
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500;background:#FBFBFC}
td.r,th.r{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:#FAF8FF}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:#fff}

/* bits */
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#C9CED4}
.btn.pri{background:var(--violet);border-color:var(--violet);color:#fff}
.btn.pri:hover{background:var(--violet-ink)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.link{border:0;background:none;padding:0;color:var(--violet-ink);text-decoration:underline;text-underline-offset:2px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--line-2);color:var(--ink-2);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.vio{background:var(--violet-soft);color:var(--violet-ink)}
.pill.plain::before{display:none}
.notice{border:1px solid var(--line);border-left:4px solid var(--violet);background:#fff;border-radius:var(--r);padding:12px 14px;margin-bottom:16px}
.notice.warn{border-left-color:#D98A00;background:var(--warn-soft)}
.notice.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.notice.ok{border-left-color:var(--ok);background:var(--ok-soft)}
.notice h3{margin-bottom:4px}
.notice p{margin:0 0 6px}
.notice .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.src{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.insight{border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;background:#fff}
.insight .tag{font-size:11.5px;font-weight:600;color:var(--violet-ink);text-transform:uppercase;letter-spacing:.05em}
.insight p{margin:6px 0 10px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line-2);min-width:120px}
.bar i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 0 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{width:10px;height:10px;border-radius:2px;display:inline-block}
.c1{background:#C9BDFB}.c2{background:#9C80FA}.c3{background:#612FFF}.c4{background:#E0A040}.c5{background:#1E9E62}
.wf td{padding:7px 10px}
.wf tr.total td{font-weight:600;border-top:1px solid var(--line);border-bottom:0}
.wf tr.flag td{background:var(--warn-soft)}
.check{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line-2)}
.check:last-child{border-bottom:0}
.check .pill{flex:none}
.draft{background:var(--bg);border:1px dashed #C9CED4;border-radius:var(--r);padding:10px 12px;margin:6px 0}
ol.steps{margin:4px 0 0;padding-left:18px}
ol.steps li{margin:2px 0}

/* Kai panel */
.kai{border-left:1px solid var(--line);background:#fff;display:flex;flex-direction:column;height:calc(100vh - 92px);position:sticky;top:0}
.kai-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.kai-h b{font-size:15px}
.kai-h .small{display:block}
.kai-log{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:100%}
.msg.u{align-self:flex-end;background:var(--violet);color:#fff;border-radius:12px 12px 2px 12px;padding:8px 12px;max-width:85%}
.msg.k{background:var(--bg);border:1px solid var(--line-2);border-radius:12px 12px 12px 2px;padding:10px 12px}
.msg.k p{margin:0 0 8px}
.msg.k p:last-child{margin-bottom:0}
.msg.k table{font-size:12.5px;margin:6px 0 8px;background:#fff;border:1px solid var(--line-2);border-radius:6px}
.msg.k td,.msg.k th{padding:5px 8px}
.fb{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px 0}
.chip{border:1px solid var(--violet-line);background:var(--violet-soft);color:var(--violet-ink);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--violet)}
.kai-f{padding:12px 16px 14px;border-top:1px solid var(--line);margin-top:10px}
.kai-f form{display:flex;gap:8px}
.kai-f input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
.kai-f .small{margin-top:6px}
.kai-toggle{display:none}

/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(20,23,26,.36);z-index:40}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(620px,100%);background:#fff;z-index:41;box-shadow:-8px 0 30px rgba(0,0,0,.12);display:flex;flex-direction:column}
.drawer header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.drawer .body{padding:18px 22px 40px;overflow-y:auto}
.drawer section{margin-bottom:22px}
.x{border:1px solid var(--line);background:#fff;border-radius:8px;width:32px;height:32px;cursor:pointer;flex:none;font-size:18px;line-height:1}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(480px,calc(100% - 24px));background:#fff;border-radius:var(--r-lg);z-index:51;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal + .scrim, .scrim.m{z-index:50}
.modal textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;margin-top:6px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.err{color:var(--bad);font-size:12.5px;margin-top:4px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;z-index:60;font-size:13px;max-width:calc(100% - 24px)}
.empty{padding:20px;text-align:center;color:var(--muted)}

@media (max-width:1180px){
  .app{grid-template-columns:200px minmax(0,1fr)}
  .kai{position:fixed;right:0;top:0;height:100%;width:min(400px,100%);z-index:30;box-shadow:-8px 0 30px rgba(0,0,0,.12);display:none}
  .kai.open{display:flex}
  .kai-toggle{display:inline-flex;position:fixed;right:16px;bottom:16px;z-index:29}
}
@media (max-width:780px){
  .app,.app.ops{grid-template-columns:1fr}
  .side{display:none}
  main{padding:16px 14px 80px}
  .grid3{grid-template-columns:1fr}
  .clock{margin-left:0;width:100%}
  .demo{gap:10px}
}
@media (prefers-reduced-motion:no-preference){
  .drawer{animation:slide .18s ease-out}
  @keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
}
@media print{.concept,.demo,.kai,.kai-toggle{display:none}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="concept" role="note">
  <span>Concept prototype by Shri Nagarajan. Not affiliated with or endorsed by Airwallex. All businesses, people and figures are fictional; rates and fees are illustrative.</span>
  <span><a href="brief.html">Read the one-page brief</a></span>
</div>

<div class="demo" aria-label="Demo controls">
  <div class="grp"><span class="lbl" id="lv">Whose screen</span>
    <div class="seg" role="group" aria-labelledby="lv">
      <button type="button" data-view="merchant" aria-pressed="true">Business</button>
      <button type="button" data-view="ops" aria-pressed="false">Settlement ops</button>
    </div>
  </div>
  <div class="grp"><label for="mk">Market</label>
    <select id="mk"><option value="uk">UK entity, GBP home</option><option value="eu">EU entity, EUR home</option></select>
  </div>
  <div class="grp"><label for="sc">What's happening</label>
    <select id="sc">
      <option value="normal">Normal day</option>
      <option value="late">Card scheme funding is late</option>
      <option value="negative">Refunds exceed sales (negative batch)</option>
    </select>
  </div>
  <button type="button" class="btn sm" id="reset">Reset demo</button>
  <span class="clock" id="clock"></span>
</div>

<div class="app" id="app">
  <nav class="side" aria-label="Product navigation" id="side"></nav>
  <main id="main" tabindex="-1"></main>
  <aside class="kai" id="kai" aria-label="Kai assistant"></aside>
</div>
<button type="button" class="btn pri kai-toggle" id="kaiToggle" aria-controls="kai" aria-expanded="false">Ask Kai</button>
<div id="layer"></div>
<div class="sr" aria-live="polite" id="live"></div>

<script>
"use strict";
/* ---------- data ---------- */
const FEE = 0.019, RES = 0.05, DFEE = 15, FXM = 0.006;
const MARKETS = {
  uk:{ merchant:"Fernhill Outdoor Ltd", short:"FO", place:"Kendal, Cumbria", entity:"UK entity", tz:"London time", clock:"12:30", locale:"en-GB",
    home:"GBP", second:"EUR", conv:["AUD","USD"], add:"AUD",
    rate:{EUR:1.14, AUD:1.98, USD:1.31},
    mix:[["GBP",61],["EUR",22],["AUD",9],["USD",8]],
    out:[["GBP","Payroll, rent and UK suppliers",142000],["EUR","EU fulfilment and ads",18500],["AUD","Ballarat Merino Mills (wool)",38000],["USD","Software subscriptions",2100]],
    supplier:{name:"Ballarat Merino Mills", ccy:"AUD", amt:38000, date:"Tue 1 Dec"},
    b:{ home:{n:412,gross:24860,ref:1240,refN:19,cb:310,cbN:2,rel:1128.50},
        second:{n:166,gross:11460,ref:380,refN:6,cb:0,cbN:0,rel:402.10,mc:4920,mcN:71},
        conv:{AUD:{n:31,gross:3960},USD:{n:22,gross:2489}} },
    avail:{home:48900, second:7150, secondNeg:1180}, reserve:{home:6300, second:2410},
    flight:{home:{today:18420,funding:31960}, second:{today:6240,funding:12890}},
    recall:{item:"Skiddaw down jacket", refunds:14200, n:214},
    rails:"Faster Payments", safeguard:"FCA safeguarding rules (CASS 15)", returnDue:"Mon 21 Dec",
    ops:{ fund:{total:412300, merchants:1860, holdAmt:41300, holdN:158, headroom:18400000, committed:6100000}, credit:{amt:2410.55, ref:"FERNHILL INV2231", payer:"Lakeland Guiding Co"}, dup:{merchant:"Northlight Studios", amt:89, order:"NS-55120"} },
    variance:14.20, threshold:"£250,000"
  },
  eu:{ merchant:"Mareel B.V.", short:"MA", place:"Utrecht, Netherlands", entity:"EU entity", tz:"Amsterdam time", clock:"13:30", locale:"en-NL",
    home:"EUR", second:"USD", conv:["GBP","AUD"], add:"GBP",
    rate:{USD:1.15, GBP:0.877, AUD:1.74},
    mix:[["EUR",64],["USD",19],["GBP",11],["AUD",6]],
    out:[["EUR","Payroll, rent and EU suppliers",121000],["USD","US ads and freight",14200],["GBP","Pennine Fulfilment (UK warehouse)",24000],["AUD","Marketplace fees",900]],
    supplier:{name:"Pennine Fulfilment", ccy:"GBP", amt:24000, date:"Tue 1 Dec"},
    b:{ home:{n:388,gross:27340,ref:1610,refN:22,cb:250,cbN:2,rel:1190.40},
        second:{n:120,gross:9120,ref:260,refN:4,cb:0,cbN:0,rel:380,mc:3880,mcN:58},
        conv:{GBP:{n:34,gross:3110},AUD:{n:19,gross:2780}} },
    avail:{home:52300, second:6400, secondNeg:940}, reserve:{home:7100, second:1950},
    flight:{home:{today:20110,funding:35020}, second:{today:4980,funding:10140}},
    recall:{item:"Ventoux rain shell", refunds:12900, n:188},
    rails:"SEPA Instant", safeguard:"safeguarding requirements for the EU e-money entity", returnDue:null,
    ops:{ fund:{total:386900, merchants:1540, holdAmt:38700, holdN:131, headroom:9600000, committed:3900000}, credit:{amt:2410.55, ref:"MAREEL INV2231", payer:"Fietsatelier Groen"}, dup:{merchant:"Studio Veld", amt:89, order:"SV-30718"} },
    variance:14.20, threshold:"€250,000"
  }
};
const SYM = {GBP:"pounds", EUR:"euros", AUD:"Australian dollars", USD:"US dollars"};

const fresh = () => ({view:"merchant", market:"uk", scenario:"normal", mtab:"overview", otab:"exceptions",
  added:false, fast:false, reviewAsked:false, e1:null, e4:null, e5:null, e6:null, kai:[], fb:0, audit:[]});
let S = fresh();
const M = () => MARKETS[S.market];

/* ---------- helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = (t) => String(t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2 = (n) => Math.round(n*100)/100;
const money = (n, c) => new Intl.NumberFormat(M().locale,{style:"currency",currency:c,minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
const money0 = (n, c) => new Intl.NumberFormat(M().locale,{style:"currency",currency:c,maximumFractionDigits:0}).format(n);
const say = (t) => { const l = $("#live"); l.textContent = ""; setTimeout(()=> l.textContent = t, 30); };
const log = (who, what) => S.audit.unshift({t: nowStamp(), who, what});
let tick = 0; const nowStamp = () => { const base = M().clock.split(":").map(Number); const m = base[1] + (tick++); return `${String(base[0]+Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`; };
function toast(t){ const d = document.createElement("div"); d.className="toast"; d.setAttribute("role","status"); d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),3200); }

/* ---------- settlement maths ---------- */
function batch(key, base=false){
  const m = M(), b = m.b;
  if (key === "fallback"){
    const conv = m.conv.map(c => ({c, n:b.conv[c].n, gross:b.conv[c].gross, home:r2(b.conv[c].gross / m.rate[c])}));
    const gross = r2(conv.reduce((a,x)=>a+x.home,0)), n = conv.reduce((a,x)=>a+x.n,0);
    const lines = conv.map(x => ({label:`${x.c} payments (${x.n}), ${money(x.gross,x.c)} converted at ${m.rate[x.c].toFixed(4)} ${x.c} per ${m.home}`, amt:x.home, src:"Settlement report: FX line"}));
    const fee = r2(gross*FEE), res = r2(gross*RES);
    lines.push({label:"Processing fees (1.9% blended, illustrative)", amt:-fee, src:"Fee report"});
    lines.push({label:"Rolling reserve held (5% for 90 days)", amt:-res, src:"Reserve plan"});
    const net = r2(lines.reduce((a,x)=>a+x.amt,0));
    return {key, ccy:m.home, n, gross, lines, net, title:`Fallback batch (${m.conv.join(" and ")} into ${m.home})`};
  }
  const d = b[key], ccy = key==="home" ? m.home : m.second;
  let gross = d.gross, ref = d.ref, refN = d.refN;
  const lines = [{label:`Card and wallet payments (${d.n})`, amt:gross, src:"Payment activity export"}];
  if (!base && key==="second" && S.scenario==="late" && S.e1==="hold"){
    lines.push({label:`Moved to Mon 23 Nov batch: ${d.mcN} Mastercard payments waiting on scheme funding`, amt:-d.mc, src:"Settlement report: deferred", flag:true});
    gross = gross - d.mc;
  }
  if (!base && key==="second" && S.scenario==="negative"){ ref = m.recall.refunds + d.ref; refN = m.recall.n + d.refN; }
  lines.push({label:`Refunds (${refN})`, amt:-ref, src:"Settlement report: refunds", flag: !base && key==="second" && S.scenario==="negative"});
  if (d.cb) { lines.push({label:`Chargebacks (${d.cbN})`, amt:-d.cb, src:"Settlement report: disputes"}); lines.push({label:`Dispute fees (${d.cbN} at ${money(DFEE,ccy)}, illustrative)`, amt:-d.cbN*DFEE, src:"Fee report"}); }
  const fee = r2(gross*FEE), res = r2(gross*RES);
  lines.push({label:"Processing fees (1.9% blended, illustrative)", amt:-fee, src:"Fee report"});
  lines.push({label:"Rolling reserve held (5% for 90 days)", amt:-res, src:"Reserve plan"});
  lines.push({label:"Reserve released (payments from Thu 20 Aug)", amt:d.rel, src:"Reserve plan: release"});
  const net = r2(lines.reduce((a,x)=>a+x.amt,0));
  return {key, ccy, n:d.n, gross:d.gross, lines, net, title:`${ccy} batch`};

function tonight(){ return ["home","second","fallback"].map(k=>batch(k)); }
function pastBatches(){
  const m = M(), out = [];
  [["Thu 19 Nov",0.93],["Wed 18 Nov",1.06]].forEach(([day,f],i)=>{
    ["home","second","fallback"].forEach(k=>{
      const bt = batch(k,true), lines = bt.lines.map(l=>({...l, amt:r2(l.amt*f)}));

}

function route(text){
  const t = text.toLowerCase();
  if (/card number|full card|\bpan\b|card details/.test(t)) return "card";
  if (/14\.?20|unexplained|doesn.?t add|short|missing money|wednesday/.test(t)) return "variance";
  if (S.scenario==="negative" && /negative|recall|refund/.test(t)) return "negative";
  if (S.scenario==="late" && /late|delay|mastercard|waiting/.test(t)) return "late";
  if (/weekend|saturday|sunday|monday|tuesday|when.*(arrive|land|get)/.test(t)) return "weekend";
  if (/reserve|held back|holding/.test(t)) return "reserve";
  if (/convert|fx|exchange|aud|usd|gbp|eur|pounds|euros|dollars/.test(t)) return "fallback";
  if (/less|lower|fees?|why.*(payout|batch)|difference|net/.test(t)) return "payout";
  return "unknown";
}

function ask(intent, text, batchId){
  const p = prompts().find(x=>x[0]===intent);
  S.kai.push({who:"u", text: text || (p?p[1]:intent)});
  const a = answer(intent, batchId); S.kai.push({who:"k", html:a.html, fb:a.fb});
  if (intent==="variance" && S.e6!=="done" && !S.e6) S.e6 = "open";
  renderKai(); openKaiMobile(); say("Kai replied");
}

  const prev = $("#layer").innerHTML;
  const wrap = document.createElement("div");
  wrap.innerHTML = `<div class="scrim m"></div><div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="mdT" aria-describedby="mdD"><h2 id="mdT">${title}</h2><p id="mdD">${text}</p>${reason?`<label for="mdR" class="small">${reason}</label><textarea id="mdR"></textarea><div class="err" id="mdE" hidden>Please add a reason. It goes in the audit trail.</div>`:""}<div class="acts"><button class="btn" id="mdN">Cancel</button><button class="btn pri" id="mdY">${ok}</button></div></div>`;
  document.body.appendChild(wrap);
  const first = reason ? $("#mdR", wrap) : $("#mdY", wrap); first.focus();
  const done = () => wrap.remove();
  $("#mdN", wrap).onclick = () => { done(); };
  $("#mdY", wrap).onclick = () => { if (reason){ const v = $("#mdR",wrap).value.trim(); if(!v){ $("#mdE",wrap).hidden=false; $("#mdR",wrap).focus(); return; } onOk(v); } else onOk(); done(); };
  wrap.addEventListener("keydown", e => { if (e.key==="Escape"){ e.stopPropagation(); done(); } if (e.key==="Tab"){ const f=[...wrap.querySelectorAll("button,textarea")]; const i=f.indexOf(document.activeElement); if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus();} else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus();} } });
}

/* ---------- actions ---------- */
function approve(what){
  const m = M(), s = m.supplier;
  if (what==="added") confirmBox({title:`Settle ${s.ccy} as ${s.ccy}?`, text:`From the Mon 23 Nov batch, ${s.ccy} payments will settle into your ${s.ccy} balance instead of being converted into ${m.home}. You can change this back at any time.`, ok:"Approve", onOk:()=>{ S.added=true; log("You (approved Kai's suggestion)",`${s.ccy} now settles as ${s.ccy} from Mon 23 Nov`); rerender(); toast(`${s.ccy} will settle as ${s.ccy} from Monday`); }});
  if (what==="fast") confirmBox({title:"Switch on fast settlement?", text:"From Mon 23 Nov, funded payments move into your wallet in batches through the day. Some fees will post in a separate end-of-day batch.", ok:"Switch on", onOk:()=>{ S.fast=true; log("You (approved Kai's suggestion)","Fast settlement on from Mon 23 Nov"); rerender(); toast("Fast settlement starts Monday"); }});
  if (what==="review") confirmBox({title:"Request a reserve review?", text:"Kai will send the risk team your last six months of dispute history. They'll reply within 3 business days. Your reserve stays as it is until they decide.", ok:"Send request", onOk:()=>{ S.reviewAsked=true; log("Kai, on your request","Reserve review sent to risk team with dispute history"); rerender(); toast("Review request sent"); }});
}
function rerender(){ render(); }

document.addEventListener("click", e => {
  const t = e.target.closest("button,tr.click,[data-close]"); if (!t) return;
  if (t.matches("[data-close]")) return closeLayer();
  if (t.dataset.view){ S.view = t.dataset.view; return render(); }
  if (t.dataset.mtab){ S.mtab = t.dataset.mtab; render(); return $(`#t-${S.mtab}`).focus(); }
  if (t.dataset.otab){ S.otab = t.dataset.otab; render(); return $(`#t-${S.otab}`).focus(); }
  if (t.dataset.goto){ closeLayer(); S.view="merchant"; S.mtab = t.dataset.goto; render(); return $(`#t-${S.mtab}`).focus(); }
  if (t.dataset.batch && !t.dataset.askbatch){ e.stopPropagation(); return openBatch(t.dataset.batch); }
  if (t.dataset.askbatch){ closeLayer(); return ask("batch","Explain this batch",t.dataset.askbatch); }
  if (t.dataset.csv) return csvFor(t.dataset.csv);
  if (t.dataset.ask) return ask(t.dataset.ask);
  if (t.dataset.approve) return approve(t.dataset.approve);
  if (t.dataset.undo){ const w=t.dataset.undo; S[w]=false; log("You", w==="added"?`${M().supplier.ccy} back to converting into ${M().home}`:"Fast settlement off"); return render(); }
  if (t.dataset.fb){ S.kai[+t.dataset.fb].fb = t.dataset.v; if (t.dataset.v==="no") S.fb++; return renderKai(); }
  if (t.dataset.fbr){ S.kai[+t.dataset.fbr].fb = "r:"+t.dataset.r; renderKai(); return say("Feedback sent to the Settlements product team"); }
  if (t.dataset.e5){ S.e5 = t.dataset.e5; log("You", "Chose how to cover tonight's negative batch"); render(); return say("Choice saved"); }
  if (t.dataset.exc){ return openExc(t.dataset.exc); }
  if (t.dataset.e1==="approve") return confirmBox({title:"Treasury sign-off", text:"Pre-funding this amount needs a second approver. In this demo, Treasury approver Priya Shah (fictional) signs off when you confirm.", ok:"Confirm with Treasury", onOk:()=>{ S.e1="approve"; log("Ops + Treasury","E1 pre-funding approved"); closeLayer(); render(); openExc("E1"); toast("Pre-funded. Merchant notices sent."); }});
  if (t.dataset.e1==="hold") return confirmBox({title:"Hold everything until funded?", text:"All affected merchants move to Monday's batch and get the held notice.", ok:"Hold", reason:"Reason (required)", onOk:(r)=>{ S.e1="hold"; log("Ops",`E1 held: ${r}`); closeLayer(); render(); openExc("E1"); }});
  if (t.dataset.e4){ S.e4 = t.dataset.e4; log("Ops", `E4 ${S.e4==="pause"?"paused second refund and asked merchant":"released second refund"}`); closeLayer(); render(); return openExc("E4"); }
  if (t.hasAttribute("data-e6")) return confirmBox({title:"Approve the fix?", text:"Backfills the missing fee line into 313 reports and replies to the merchant in Kai. Bug PAY-SET-912 stays open until the report writer is fixed.", ok:"Approve", onOk:()=>{ S.e6="done"; log("Ops","E6 fee reports backfilled, merchant answered"); S.kai.push({who:"k", html:`<p>An update on case SET-48213: Wednesday's ${M().home} batch included a Visa scheme fee adjustment for October of ${money(M().variance,M().home)}. It was missing from your fee report, which now has the line. Sorry about that.</p>`}); closeLayer(); render(); openExc("E6"); toast("Fix approved. Merchant answered in Kai."); }});
  if (t.hasAttribute("data-undo-e2")) return toast("Demo only: undo would reopen the match and the safeguarding item.");
  if (t.id==="reset"){ S = fresh(); tick=0; closeLayer(); render(); return toast("Demo reset"); }
  if (t.id==="kaiClose"){ $("#kai").classList.remove("open"); $("#kaiToggle").setAttribute("aria-expanded","false"); return $("#kaiToggle").focus(); }
  if (t.id==="kaiToggle"){ const o = !$("#kai").classList.contains("open"); $("#kai").classList.toggle("open",o); t.setAttribute("aria-expanded",String(o)); if(o) $("#kaiIn").focus(); return; }
  if (t.matches("tr.click") && t.dataset.batch) return openBatch(t.dataset.batch);
  if (t.matches("tr.click") && t.dataset.exc) return openExc(t.dataset.exc);
});
document.addEventListener("submit", e => { if (e.target.id!=="kaiForm") return; e.preventDefault(); const v = $("#kaiIn").value.trim(); if (!v) return; ask(route(v), v); setTimeout(()=>$("#kaiIn") && $("#kaiIn").focus(),0); });
document.addEventListener("keydown", e => {
  if (e.key==="Escape" && $("#layer").innerHTML) return closeLayer();
  const tab = e.target.closest('[role="tab"]');
  if (tab && (e.key==="ArrowRight"||e.key==="ArrowLeft")){
    const all = [...tab.parentElement.children], i = all.indexOf(tab), n = all[(i + (e.key==="ArrowRight"?1:-1) + all.length) % all.length];
    n.click();
  }
  const row = e.target.closest("tr.click");
  if (row && e.key==="Enter" && e.target===row){ row.dataset.batch ? openBatch(row.dataset.batch) : openExc(row.dataset.exc); }
  const dw = $(".drawer");
  if (dw && e.key==="Tab" && !document.querySelector(".modal")){ const f=[...dw.querySelectorAll("button,a,[tabindex='0']")]; const i=f.indexOf(document.activeElement); if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus();} else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus();} }
});
$("#mk").addEventListener("change", e => { S.market = e.target.value; Object.assign(S,{kai:[],added:false,fast:false,reviewAsked:false,e1:null,e4:null,e5:null,e6:null,audit:[]}); closeLayer(); render(); say(`Market changed to ${M().entity}`); });
$("#sc").addEventListener("change", e => { S.scenario = e.target.value; S.e1=null; S.e5=null; S.kai=[]; closeLayer(); render(); say("Scenario changed"); });
render();
</script>
</body>
</html>
